name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (0 errors enforced)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Comment style guard
        run: pnpm lint:comments

      - name: Build app and Electron main process
        # e2e 通过 electron.launch 启动真实 Electron,需要 dist-electron/main.js 与 dist/index.html
        run: pnpm build

      - name: Run tests with coverage
        # 启动后台 Xvfb 并显式 export DISPLAY,供 Electron 的 ozone/x11 平台使用。
        # 不用 xvfb-run 包裹:经 pnpm -> vitest -> playwright -> electron 多层 spawn 后
        # 它设的 DISPLAY 在某些 ubuntu runner 上传不到 electron 子进程,导致
        # 'Missing X server or $DISPLAY' + SIGSEGV。
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac &
          export DISPLAY=:99
          pnpm test:ci

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
